<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthetic Indices Calculator</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <h1>Primetrex Indices Calculator</h1>
        <p class="subtitle">Calculate position size for synthetic indices</p>

        <form id="syntheticForm">
            <div class="form-group">
                <label for="instrument">Select Instrument</label>
                <select id="instrument" required>
                    <option value="">Choose an instrument...</option>
                    <optgroup label="Volatility Indices">
                        <option value="V10">V10</option>
                        <option value="V10_1S">V10 1s</option>
                        <option value="V100">V100</option>
                        <option value="V100_1S">V100 1s</option>
                        <option value="V25">V25</option>
                        <option value="V25_1S">V25 1s</option>
                        <option value="V75">V75</option>
                        <option value="V75_1S">V75 1s</option>
                        <option value="V50">V50</option>
                        <option value="V50_1S">V50 1s</option>
                        <option value="V5">V5</option>
                        <option value="V5_1S">V5 1s</option>
                    </optgroup>
                    <optgroup label="Jump Indices">
                        <option value="JUMP_10">Jump 10</option>
                        <option value="JUMP_100">Jump 100</option>
                        <option value="JUMP_75">Jump 75</option>
                        <option value="JUMP_50">Jump 50</option>
                        <option value="JUMP_25">Jump 25</option>
                    </optgroup>
                    <optgroup label="Step Indices">
                        <option value="STEP_INDEX">Step Index</option>
                        <option value="STEP_200">Step 200</option>
                        <option value="STEP_300">Step 300</option>
                        <option value="STEP_400">Step 400</option>
                        <option value="STEP_500">Step 500</option>
                    </optgroup>
                </select>

                <div class="instrument-info" id="instrumentInfo">
                    <div class="info-item">
                        <span class="info-label">Min Lot Size:</span> 
                        <span id="minLotSize">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Pip Calculation:</span> 
                        <span id="pipCalc">-</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="accountSize">Account Size (USD)</label>
                <div class="input-icon">
                    <input type="number" id="accountSize" step="0.01" min="0" required>
                </div>
            </div>

            <div class="form-group">
                <label>Risk Type</label>
                <div class="toggle-container">
                    <span class="toggle-label">Percentage (%)</span>
                    <div class="toggle-wrapper">
                        <input type="checkbox" id="riskToggle" class="toggle-checkbox">
                        <label for="riskToggle" class="toggle-switch"></label>
                    </div>
                    <span class="toggle-label">Fixed Amount ($)</span>
                </div>
            </div>

            <div class="form-group">
                <label for="riskValue">
                    Risk Amount
                    <span class="risk-type-display" id="riskTypeDisplay">%</span>
                </label>
                <input type="number" id="riskValue" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="entryPrice">Entry Price</label>
                <input type="number" id="entryPrice" step="0.01" min="0" required>
            </div>

            <div class="form-group">
                <label for="stopLossPrice">Stop Loss Price</label>
                <input type="number" id="stopLossPrice" step="0.01" min="0" required>
            </div>

            <button type="submit" class="calculate-btn">Calculate Position Size</button>
        </form>

        <div class="result-container" id="resultContainer">
            <div class="result-row">
                <span class="result-label">Price Difference (Units)</span>
                <span class="result-value" id="unitDiff">0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Stop Loss (Pips)</span>
                <span class="result-value" id="slPips">0.00</span>
            </div>
            <div class="result-row">
                <span class="result-label">Risk Amount</span>
                <span class="result-value" id="riskAmount">$0.00</span>
            </div>
            
            <div class="lot-size-highlight">
                <div class="lot-size-label">Recommended Lot Size</div>
                <div class="lot-size-value">
                    <span id="lotSize">0.00</span>
                    <span class="lot-size-unit">lots</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Link JS -->
    <script src="script.js"></script>
</body>
</html>
